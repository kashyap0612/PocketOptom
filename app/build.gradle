plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pocketoptom'
    compileSdk 35

    defaultConfig {
        applicationId "com.pocketoptom"
        minSdk 26          // Android 8.0 — runs on cheap phones
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Model files must stay uncompressed inside the APK so they can be memory-mapped.
    androidResources {
        noCompress 'tflite', 'task'
    }
}

// MediaPipe's face + iris landmark model. Downloaded once, before the first build.
def faceModel = file("src/main/assets/face_landmarker.task")
tasks.register('downloadFaceModel') {
    outputs.file(faceModel)
    doLast {
        if (!faceModel.exists()) {
            faceModel.parentFile.mkdirs()
            new URL('https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task')
                    .withInputStream { input -> faceModel.withOutputStream { it << input } }
        }
    }
}
tasks.named('preBuild') { dependsOn 'downloadFaceModel' }

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // CameraX: front camera preview + frame analysis
    def camerax = '1.4.1'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"

    // MediaPipe Face Landmarker (478 points incl. iris)
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'

    // TensorFlow Lite for our own quantised eye model (+ GPU delegate; NNAPI is built in)
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.16.1'
    implementation 'org.tensorflow:tensorflow-lite-gpu-api:2.16.1'
}
